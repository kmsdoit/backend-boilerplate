name: backend-boilerplate

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_password
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: local_password
    command:
      # utf8mb4 end to end. The 8.0 default is already utf8mb4, but stating it
      # stops a future image default from silently changing string comparison.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Separate server for the integration suite, on its own port. Sharing one
  # with local development means a test run can wipe data you were looking at.
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_password
      MYSQL_DATABASE: app_test
      MYSQL_USER: app
      MYSQL_PASSWORD: local_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3308:3306"
    tmpfs:
      # Test data never needs to outlive the container, and tmpfs makes the
      # suite meaningfully faster.
      - /var/lib/mysql:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  mysql-data:
