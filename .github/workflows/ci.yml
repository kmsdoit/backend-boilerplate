name: ci

on:
  push:
  pull_request:

jobs:
  # Fast gate: everything that does not need a database. Kept separate so a
  # formatting mistake fails in seconds instead of waiting on a database.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      # TRAP: this filter lists projects explicitly. A new workspace package
      # missing from `test:unit` in package.json is silently never run here.
      - run: bun run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Start MySQL
        # `docker compose`, not a `services:` block, so CI boots the database
        # with the same flags and healthcheck a developer runs locally. The
        # collation in particular is load-bearing: case-insensitive search is a
        # property of utf8mb4_0900_ai_ci, not of the query, so a container
        # started with different defaults would pass or fail differently.
        run: bun run test:db:up

      - run: bun run test:db:migrate
      - run: bun run test:integration
      # Built separately from the suite that invokes the handler: bundling can
      # break on its own, since knex `require`s database drivers that are not
      # installed and a dependency bump can add one to the externals list.
      - run: bun run build:lambda

      - name: MySQL logs
        # Only on failure, and only the tail: a server that refuses to become
        # healthy says why here, and without it the job reports a bare timeout.
        if: failure()
        run: docker compose logs --tail 100 mysql-test

  # The boilerplate's core promise: you can delete the bundled example, scaffold
  # your own domain, and still have a working, tested service. Without this job
  # that is a claim in the README; with it, a regression in new:domain or
  # remove:domain fails the build. It has already caught three (a wiring line
  # deleted whole instead of edited, a dangling uniqueConstraintErrors entry,
  # and a seed.ts left importing a removed entity).
  scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Start MySQL
        run: bun run test:db:up

      - name: Delete the example and scaffold a new domain
        run: |
          bun run remove:domain user
          bun run new:domain order
      - name: The scaffolding still builds and its own tests still pass
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: MySQL logs
        if: failure()
        run: docker compose logs --tail 100 mysql-test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is built on every push because the failure mode it catches --
      # a workspace package added without updating the COPY list -- is invisible
      # to every other job here.
      - run: docker build -f backend/Dockerfile -t ${{ github.repository }}:ci .
