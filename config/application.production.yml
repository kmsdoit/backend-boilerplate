# Production. Every secret and environment-specific endpoint is a ${VAR}
# placeholder resolved from the process environment at startup -- this file is
# safe to commit and safe to ship in a ConfigMap. If a variable is missing the
# process fails at load with the name of the variable and the config path that
# needed it, rather than starting up in a half-configured state.
application:
  name: backend-boilerplate
  environment: production

server:
  port: 3000
  # One comma-separated env var, split by the loader.
  corsOrigins: ${CORS_ORIGINS}
  maxBodyBytes: 1048576
  rateLimit:
    windowSeconds: 60
    maxWrites: 30


auth:
  jwtSecret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

# No `endpoint`: the SDK resolves the real DynamoDB endpoint for the region.
# No credentials: the task or instance role supplies them.
dynamo:
  region: ${AWS_REGION}
  tableNamePrefix: ${DYNAMO_TABLE_PREFIX}
