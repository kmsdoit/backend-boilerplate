# Local development. Matches the `postgres` service in compose.yaml.
application:
  name: backend-boilerplate
  environment: development

server:
  port: 3000
  corsOrigins:
    - http://localhost:5173
    - http://localhost:3000
  maxBodyBytes: 1048576
  rateLimit:
    windowSeconds: 60
    maxWrites: 30


auth:
  jwtSecret: local-development-only-secret-at-least-32-chars

dynamo:
  endpoint: http://localhost:8000
  region: us-east-1
  tableNamePrefix: app
  accessKeyId: local
  secretAccessKey: local
